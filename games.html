<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browse Games · c9i.org</title>
  <meta name="description" content="Browse free browser games from EasyHub with short intros" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/">c9i</a>
    <nav>
      <a href="/">Random pick</a>
      <a href="/games.html" class="active">Browse games</a>
      <a href="https://easyhub.games/" target="_blank" rel="noopener noreferrer">EasyHub.games</a>
    </nav>
  </header>

  <main class="page browse-page">
    <header class="browse-header">
      <h1>Game gallery</h1>
      <p>Hand-picked titles from EasyHub with a taste of each intro. Tap a card to play.</p>
    </header>

    <section class="panel loading-panel" id="loading">
      <div class="dice" aria-hidden="true">🎲</div>
      <p>Loading game catalog…</p>
    </section>

    <div class="catalog hidden" id="catalog"></div>

    <section class="panel error-panel hidden" id="error">
      <p>Could not load the catalog.</p>
      <a class="btn btn-ghost" href="/">Back to random pick</a>
    </section>
  </main>

  <footer class="footer">
    <p>Content from <a href="https://easyhub.games/" target="_blank" rel="noopener noreferrer">EasyHub.games</a>.</p>
  </footer>

  <script src="/js/games.js" type="module"></script>
</body>
</html>
